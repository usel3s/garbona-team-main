<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Главная - Garbona</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <base href="/app/" />
    <link rel="stylesheet" href="/shared/sidebar.css" />
    <link rel="stylesheet" href="css/worker.css?v=notif-cards2" />
    <link rel="stylesheet" href="css/panel-extra.css?v=analytics-no-earned-plaque" />
    <link rel="stylesheet" href="assets/dashboard/dashboard.css?v=react-dash29" />
    <link rel="icon" href="/app/assets/logo-mark.png?v=gb4" type="image/png" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Garbona">
        <div class="sidebar-header">
          <div id="workspaceSwitcher"></div>
        </div>

        <div class="sidebar-content">
          <nav class="nav" id="nav"></nav>
        </div>

        <div class="sidebar-footer">
          <button type="button" class="nav-item nav-item--logout" id="sidebarLogoutBtn">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M10 4.5H6.5A1.5 1.5 0 0 0 5 6v12a1.5 1.5 0 0 0 1.5 1.5H10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M14 8.5 18.5 12 14 15.5M18.2 12H9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="nav-item-label" data-i18n="nav.logout">Выйти</span>
          </button>
        </div>

        <button type="button" class="sidebar-collapse" id="sidebarCollapse" hidden aria-pressed="false" aria-label="Свернуть меню">
          <svg class="sidebar-collapse-collapse" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14.5 7 10 12l4.5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="sidebar-collapse-expand" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M10 7l4.5 5L10 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" class="sidebar-rail" id="sidebarRail" hidden tabindex="-1" aria-label="Свернуть меню"></button>
      </aside>

      <div class="shell">
        <header class="worker-topbar" id="workerTopbar">
          <div class="worker-topbar__user">
            <img class="worker-topbar__avatar" id="topbarAvatar" alt="" width="32" height="32" />
            <div class="worker-topbar__copy">
              <strong id="topbarUserName">вЂ”</strong>
              <small>USER</small>
            </div>
          </div>
          <div class="worker-topbar__actions">
            <div class="worker-balance-wrap" id="topbarBalanceWrap">
              <button type="button" class="worker-balance" id="topbarBalance" aria-expanded="false" aria-controls="topbarBalanceMenu" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4 8.2h14.5A1.5 1.5 0 0 1 20 9.7v8.1A1.5 1.5 0 0 1 18.5 19.3H5.5A1.5 1.5 0 0 1 4 17.8V8.2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                  <path d="M4 8.2V6.8A1.5 1.5 0 0 1 5.5 5.3h10.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M15.2 13.2h3.3v2.2h-3.3a1.1 1.1 0 0 1 0-2.2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
                <span id="topbarBalanceValue">0.00 $</span>
              </button>
              <div class="worker-balance-tip" id="topbarBalanceTip" hidden>Р—Р°РјРѕСЂРѕР¶РµРЅРѕ 0.00 $</div>
              <div class="worker-balance-menu" id="topbarBalanceMenu" hidden role="dialog" aria-label="Р‘Р°Р»Р°РЅСЃ">
                <div class="worker-balance-menu__row">
                  <span data-i18n="wallet.availableBalanceLabel">Р”РѕСЃС‚СѓРїРЅРѕ Рє РІС‹РІРѕРґСѓ</span>
                  <strong id="topbarAvailableValue">0.00 $</strong>
                </div>
                <div class="worker-balance-menu__row">
                  <span data-i18n="wallet.frozenLabel">РҐРѕР»Рґ РїСЂРѕРґР°Р¶</span>
                  <strong id="topbarFrozenValue">0.00 $</strong>
                </div>
                <div class="worker-balance-menu__row is-total">
                  <span data-i18n="wallet.totalBalanceLabel">РћР±С‰РёР№ Р±Р°Р»Р°РЅСЃ</span>
                  <strong id="topbarTotalValue">0.00 $</strong>
                </div>
                <button type="button" class="worker-balance-menu__cta" id="topbarWithdrawBtn" data-i18n="wallet.withdrawBtn">Р’С‹РІРµСЃС‚Рё СЃСЂРµРґСЃС‚РІР°</button>
              </div>
            </div>
            <div class="worker-topbar__notif" id="topbarNotifSlot">
              <div class="sidebar-notif is-topbar" id="notifWrap">
                <button type="button" class="sidebar-notif-btn" id="notifBell" aria-expanded="false" aria-haspopup="dialog" aria-controls="notifMenu" aria-label="Уведомления">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 4.5a5 5 0 0 1 5 5v2.2c0 .8.3 1.6.8 2.2l.7.8H5.5l.7-.8c.5-.6.8-1.4.8-2.2V9.5a5 5 0 0 1 5-5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M10 18.2a2.2 2.2 0 0 0 4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                  <span class="sidebar-notif-label" data-i18n="notif.pageTitle">Уведомления</span>
                  <span class="nav-badge" id="notifBellBadge" hidden></span>
                </button>
                <div class="notif-menu" id="notifMenu" hidden role="dialog" aria-modal="false" aria-labelledby="notifMenuTitle">
                  <div class="notif-menu-head">
                    <div class="notif-menu-heading">
                      <span class="notif-menu-title-row">
                        <strong id="notifMenuTitle" data-i18n="notif.pageTitle">Уведомления</strong>
                        <span class="notif-menu-count" id="notifMenuCount" hidden></span>
                      </span>
                      <span class="notif-menu-subtitle" data-i18n="notif.subtitle">Баны, паузы доменов и важные сигналы</span>
                    </div>
                    <button type="button" class="btn btn-ghost notif-menu-mark" id="notifMarkAllBtn" data-i18n="notif.markAll">Прочитать все</button>
                  </div>
                  <div class="notif-menu-list" id="notifMenuList" aria-live="polite" aria-busy="false"></div>
                </div>
              </div>
            </div>
          </div>
        </header>
        <main class="main" id="main"></main>
      </div>

      <nav class="mobile-nav" id="workerMobileNav"></nav>

      <div class="mobile-more" id="workerMobileMore" aria-hidden="true">
        <button type="button" class="mobile-more-backdrop" id="workerMobileMoreBackdrop"></button>
        <section class="mobile-more-sheet" id="workerMobileMoreSheet" role="dialog" aria-modal="true" aria-labelledby="workerMobileMoreTitle" tabindex="-1">
          <div class="mobile-more-handle" aria-hidden="true"></div>
          <div class="mobile-more-head">
            <h2 id="workerMobileMoreTitle" data-i18n="nav.more">Р•С‰С‘</h2>
            <button type="button" class="mobile-more-close" id="workerMobileMoreClose">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m7.5 7.5 9 9m0-9-9 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="mobile-more-body">
            <div id="workerMobileNavList"></div>
            <div class="mobile-more-group">
              <div class="mobile-more-label" data-i18n="nav.account">РђРєРєР°СѓРЅС‚</div>
              <div class="mobile-more-list">
                <div class="mobile-notif-slot" id="workerMobileNotifSlot"></div>
                <a href="#" class="mobile-more-item is-hidden" id="workerMobileGettingStarted" target="_blank" rel="noopener noreferrer">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5 5.5h5.2a3 3 0 0 1 3 3V20a2.4 2.4 0 0 0-2.4-2.4H5V5.5Zm14 0h-5.2a3 3 0 0 0-3 3V20a2.4 2.4 0 0 1 2.4-2.4H19V5.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                  </svg>
                  <span data-i18n="nav.gettingStarted">РЎ С‡РµРіРѕ РЅР°С‡Р°С‚СЊ?</span>
                  <span class="mobile-more-chevron" aria-hidden="true"></span>
                </a>
                <button type="button" class="mobile-more-item" id="workerMobileSupportBtn">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5.5 12a6.5 6.5 0 0 1 13 0v2.2a2.3 2.3 0 0 1-2.3 2.3h-.7M5.5 13.2V12M15.5 19.2c0 1.2-1.4 2.1-3.5 2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <rect x="3.8" y="12.2" width="3.2" height="4.4" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
                    <rect x="17" y="12.2" width="3.2" height="4.4" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
                  </svg>
                  <span data-i18n="nav.support">РџРѕРґРґРµСЂР¶РєР°</span>
                  <span class="mobile-more-chevron" aria-hidden="true"></span>
                </button>
                <button type="button" class="mobile-more-item is-danger" id="workerMobileLogoutBtn">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M10 4.5H6.5A1.5 1.5 0 0 0 5 6v12a1.5 1.5 0 0 0 1.5 1.5H10M14 8.5l4.5 3.5-4.5 3.5M18.2 12H9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span data-i18n="nav.logout">Р’С‹Р№С‚Рё</span>
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/shared/sidebar.js?v=nav-children1"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/prefs.js"></script>
    <script src="js/i18n.js?v=analytics-earned1"></script>
    <script src="js/nav.js?v=sidebar5"></script>
    <script src="js/format.js"></script>
    <script src="js/dropdown.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/notif.js?v=notif2"></script>
    <script src="js/notifMenu.js?v=notif2"></script>
    <script src="js/views/analytics.js?v=analytics-no-earned-plaque"></script>
    <script src="js/views/top.js?v=top-list1"></script>
    <script src="js/views/settings.js?v=lolz1"></script>
    <script src="js/views/wallet.js?v=wallet-page3"></script>
    <script src="js/views/support.js"></script>
    <script src="assets/dashboard/dashboard.js?v=react-dash29"></script>
    <script src="js/shell.js?v=nav-fix1"></script>
  </body>
</html>
