<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap");
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px; height: 1080px; overflow: hidden;
        font-family: Inter, system-ui, sans-serif; background: #eef0f2;
      }
      .stage {
        position: relative; width: 1080px; height: 1080px;
        background:
          linear-gradient(#e9ebed, #f3f4f6);
        overflow: hidden;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(0,0,0,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.7;
      }
      .brand {
        position: absolute; top: 48px; left: 52px;
        display: flex; align-items: center; gap: 12px; z-index: 5;
      }
      .brand img {
        width: 46px; height: 46px; border-radius: 50%; background: #111;
      }
      .brand span {
        font-size: 28px; font-weight: 800; letter-spacing: 0.04em; color: #1f1f1f;
      }
      .badge {
        position: absolute; top: 108px; left: 52px; z-index: 5;
        display: inline-flex; align-items: center; gap: 8px;
        height: 34px; padding: 0 14px; border-radius: 999px;
        background: #1a9f6c; color: #fff; font-size: 13px; font-weight: 700;
      }
      .headline {
        position: absolute; top: 48px; left: 290px; right: 48px; z-index: 5;
      }
      .headline h1 {
        font-size: 56px; line-height: 1.02; font-weight: 800;
        letter-spacing: -0.035em; color: #1f1f1f;
      }
      .headline h1 em { font-style: normal; color: #1a9f6c; }
      .headline p {
        margin-top: 12px; font-size: 18px; color: #7a7a7a; font-weight: 500;
      }

      /* MacBook */
      .laptop {
        position: absolute; top: 210px; left: 50%;
        transform: translateX(-50%);
        width: 620px; z-index: 2;
      }
      .lid {
        position: relative;
        background: #c8ccd0;
        border-radius: 14px 14px 0 0;
        padding: 12px 12px 0;
        box-shadow: 0 2px 0 #b4b8bc;
      }
      .bezel {
        background: #0a0a0a;
        border-radius: 8px 8px 0 0;
        padding: 10px 10px 0;
        overflow: hidden;
      }
      .camera {
        position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
        width: 6px; height: 6px; border-radius: 50%; background: #2a2a2a;
        z-index: 3;
      }
      .screen {
        display: block; width: 100%; height: 360px;
        object-fit: cover; object-position: top left;
        border-radius: 2px 2px 0 0;
      }
      .chin {
        height: 14px; background: #0a0a0a; border-radius: 0 0 2px 2px;
      }
      .base {
        height: 14px;
        background: linear-gradient(180deg, #d5d8dc, #b8bcc1);
        border-radius: 0 0 8px 8px;
        position: relative;
        box-shadow: 0 18px 35px rgba(0,0,0,0.18);
      }
      .base::before {
        content: "";
        position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        width: 90px; height: 5px; border-radius: 0 0 6px 6px;
        background: #a8adb3;
      }
      .shadow {
        height: 18px; margin: 0 auto; width: 88%;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.22), transparent 70%);
      }

      .card {
        position: absolute; z-index: 4;
        display: flex; align-items: center; gap: 12px;
        width: 210px; padding: 14px 15px; border-radius: 14px;
        background: #fff; border: 1px solid #ececec;
        box-shadow: 0 10px 24px rgba(0,0,0,0.07);
      }
      .card-icon {
        width: 36px; height: 36px; border-radius: 10px;
        background: #eef8f3; color: #1a9f6c;
        display: grid; place-items: center; flex-shrink: 0;
      }
      .card-icon svg { width: 18px; height: 18px; }
      .card strong { display: block; font-size: 15px; font-weight: 700; color: #222; }
      .card span { display: block; margin-top: 2px; font-size: 12px; color: #888; font-weight: 500; }
      .c1 { top: 270px; left: 42px; }
      .c2 { top: 270px; right: 42px; }
      .c3 { top: 500px; left: 42px; }
      .c4 { top: 500px; right: 42px; }

      .dot-line {
        position: absolute; z-index: 1; height: 0;
        border-top: 1.5px dashed #9fd9bd; pointer-events: none;
      }
      .d1 { top: 300px; left: 252px; width: 80px; }
      .d2 { top: 300px; right: 252px; width: 80px; }
      .d3 { top: 530px; left: 252px; width: 80px; }
      .d4 { top: 530px; right: 252px; width: 80px; }
      .node {
        position: absolute; width: 8px; height: 8px; border-radius: 50%;
        background: #1a9f6c; z-index: 3;
      }
      .n1 { top: 296px; left: 248px; }
      .n2 { top: 296px; right: 248px; }
      .n3 { top: 526px; left: 248px; }
      .n4 { top: 526px; right: 248px; }

      .footer {
        position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%);
        display: inline-flex; align-items: center; gap: 12px;
        height: 54px; padding: 0 30px 0 16px; border-radius: 999px;
        background: #1a9f6c; color: #fff; font-size: 17px; font-weight: 700;
        white-space: nowrap; box-shadow: 0 12px 28px rgba(26,159,108,0.3); z-index: 5;
      }
      .check {
        width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #1a9f6c;
        display: grid; place-items: center;
      }
      .check svg { width: 16px; height: 16px; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid"></div>
      <div class="brand">
        <img src="../../panel/assets/logo.png" alt="" />
        <span>GARBONA</span>
      </div>
      <div class="badge">📢 НОВЫЙ РЕЛИЗ</div>
      <div class="headline">
        <h1>ВЕБ-ПАНЕЛЬ<br /><em>ЗАПУЩЕНА</em></h1>
        <p>Статистика, сайты и кошелёк — в одном окне</p>
      </div>

      <div class="dot-line d1"></div>
      <div class="dot-line d2"></div>
      <div class="dot-line d3"></div>
      <div class="dot-line d4"></div>
      <div class="node n1"></div>
      <div class="node n2"></div>
      <div class="node n3"></div>
      <div class="node n4"></div>

      <div class="card c1">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16l4-4 3 3 6-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div><strong>Дашборд</strong><span>сводка за день</span></div>
      </div>
      <div class="card c2">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 19.5h15M7 16.5V11M12 16.5V7.5M17 16.5v-3.2" stroke-linecap="round"/></svg>
        </div>
        <div><strong>Аналитика</strong><span>графики и метрики</span></div>
      </div>
      <div class="card c3">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9h17"/></svg>
        </div>
        <div><strong>Сайты и ссылки</strong><span>в панели</span></div>
      </div>
      <div class="card c4">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8.2h14.5A1.5 1.5 0 0 1 20 9.7v8.1A1.5 1.5 0 0 1 18.5 19.3H5.5A1.5 1.5 0 0 1 4 17.8V8.2Z"/><path d="M4 8.2V6.8A1.5 1.5 0 0 1 5.5 5.3h10.2" stroke-linecap="round"/></svg>
        </div>
        <div><strong>Кошелёк</strong><span>баланс и выплаты</span></div>
      </div>

      <div class="laptop">
        <div class="lid">
          <div class="camera"></div>
          <div class="bezel">
            <img class="screen" src="./dashboard-crop.png" alt="" />
            <div class="chin"></div>
          </div>
        </div>
        <div class="base"></div>
        <div class="shadow"></div>
      </div>

      <div class="footer">
        <div class="check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12.5 9.5 17 19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        Одна панель. Полный контроль над работой
      </div>
    </div>
  </body>
</html>
