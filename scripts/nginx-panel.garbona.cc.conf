# Production vhosts for garbona.cc.
# Origin is the local Node panel (PANEL_PORT, default 3000).
# Cloudflare should proxy (orange cloud) these hostnames and terminate TLS.
# HTTP/80 here is enough when Cloudflare SSL mode is Flexible or Full.
#
#   garbona.cc                          → worker cabinet (canonical)
#   www / panel.garbona.cc              → 308 → https://garbona.cc
#   admin.garbona.cc                    → admin web panel
#   docs.garbona.cc                     → public docs

# Legacy mirrors → canonical worker host
server {
    listen 80;
    listen [::]:80;
    server_name www.garbona.cc panel.garbona.cc;
    return 308 https://garbona.cc$request_uri;
}

# Worker cabinet — canonical
server {
    listen 80;
    listen [::]:80;
    server_name garbona.cc;
    absolute_redirect off;

    client_max_body_size 25m;

    location = / {
        return 308 /app/;
    }

    location /docs {
        return 308 https://docs.garbona.cc$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# Admin web panel — ADMIN_PANEL_URL
server {
    listen 80;
    listen [::]:80;
    server_name admin.garbona.cc;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# Public docs — MANUALS_DOCS_URL = https://docs.garbona.cc/docs/
server {
    listen 80;
    listen [::]:80;
    server_name docs.garbona.cc;
    absolute_redirect off;

    client_max_body_size 25m;

    location /docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        return 308 /docs/;
    }
}
